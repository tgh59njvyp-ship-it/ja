    <script>
      (function() {
        var RealWebSocket = window.WebSocket;
        function MockWebSocket(url, protocols) {
          var self = this;
          self.url = url;
          self.readyState = 1; // WebSocket.OPEN
          self.OPEN = 1;
          self.CLOSED = 3;
          self.CONNECTING = 0;
          self.CLOSING = 2;
          self.bufferedAmount = 0;
          self.extensions = '';
          self.protocol = Array.isArray(protocols) ? (protocols[0] || '') : (protocols || '');
          self.binaryType = 'blob';

          var listeners = {
            open: [],
            message: [],
            close: [],
            error: []
          };

          self.addEventListener = function(event, callback) {
            if (listeners[event]) {
              listeners[event].push(callback);
            }
          };

          self.removeEventListener = function(event, callback) {
            if (listeners[event]) {
              listeners[event] = listeners[event].filter(function(cb) { return cb !== callback; });
            }
          };

          self.dispatchEvent = function(event) {
            var eventType = event.type;
            if (listeners[eventType]) {
              listeners[eventType].forEach(function(cb) {
                try { cb.call(self, event); } catch (e) {}
              });
            }
            if (typeof self['on' + eventType] === 'function') {
              try { self['on' + eventType].call(self, event); } catch (e) {}
            }
            return true;
          };

          self.send = function() {};

          self.close = function(code, reason) {
            self.readyState = 3;
            var closeEvt = { type: 'close', wasClean: true, code: code || 1000, reason: reason || 'Normal' };
            setTimeout(function() {
              self.dispatchEvent(closeEvt);
            }, 0);
          };

          // Deliver open event asynchronously so Vite sets isOpened = true
          setTimeout(function() {
            if (self.readyState === 1) {
              self.dispatchEvent({ type: 'open' });
            }
          }, 0);
        }

        MockWebSocket.OPEN = 1;
        MockWebSocket.CLOSED = 3;
        MockWebSocket.CONNECTING = 0;
        MockWebSocket.CLOSING = 2;
        if (RealWebSocket) {
          MockWebSocket.prototype = RealWebSocket.prototype;
        }
        window.WebSocket = MockWebSocket;

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.message || String(reason))) || '';
          if (msg.includes('WebSocket') || msg.includes('ws') || msg.includes('@vite/client')) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = (event && event.message) || '';
          var filename = (event && event.filename) || '';
          if (msg.includes('WebSocket') || msg.includes('ws') || filename.includes('@vite/client')) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
